<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempo</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="js/index.js" defer></script>
</head>
<body>
    <main> 
        <section class="painel">
            <header class="cabecalho">
                <span class="icone-clima">☀</span>
                <div>
                    <p class="subtitulo">Previsão do Tempo</p>
                    <h1 class="titulo">como esta o clima?</h1>
                </div>

            </header>


            <div class="busca">
                <label for="cidade">Busque uma cidade Brasileira</label>
                <div>
                <span>⌕</span>
                <input type="text" id="cidade" placeholder="Jacareí" autocomplete="off" >
                </div>
            </div>
            <small>Digite o nome e precione Enter</small>
        
            <p id="mensagem"></p>
            <div id="cidades"></div>
            <div id="previsao"></div>
        </section>   
        

       
    </main>
    
</body>
</html>
